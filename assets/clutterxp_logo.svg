<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="softFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Back Folder Tab -->
    <path d="M 80 200 L 80 160 C 80 148 90 138 102 138 L 190 138 C 202 138 212 146 218 156 L 235 185 C 240 194 250 200 260 200 L 410 200 C 422 200 432 210 432 222 L 432 270"
          fill="none" stroke="url(#mainGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- File Sheets Cascading In -->
    <!-- Sheet 3 (Furthest Back / Highest) -->
    <g transform="translate(250, 48)">
      <path d="M 0 16 C 0 7 7 0 16 0 L 72 0 L 104 32 L 104 120 C 104 129 97 136 88 136 L 16 136 C 7 136 0 129 0 120 Z"
            fill="url(#softFill)" stroke="url(#sheetGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 72 0 L 72 32 L 104 32" fill="none" stroke="url(#sheetGrad)" stroke-width="10" stroke-linejoin="round" />
      <line x1="24" y1="55" x2="60" y2="55" stroke="url(#sheetGrad)" stroke-width="8" stroke-linecap="round" opacity="0.8" />
      <line x1="24" y1="80" x2="80" y2="80" stroke="url(#sheetGrad)" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- Sheet 2 (Middle) -->
    <g transform="translate(200, 95)">
      <path d="M 0 16 C 0 7 7 0 16 0 L 82 0 L 118 36 L 118 135 C 118 144 111 151 102 151 L 16 151 C 7 151 0 144 0 135 Z"
            fill="url(#softFill)" stroke="url(#mainGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 82 0 L 82 36 L 118 36" fill="none" stroke="url(#mainGrad)" stroke-width="10" stroke-linejoin="round" />
      <line x1="26" y1="62" x2="68" y2="62" stroke="url(#mainGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85" />
      <line x1="26" y1="90" x2="92" y2="90" stroke="url(#mainGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    </g>

    <!-- Sheet 1 (Front / Dropping into folder) -->
    <g transform="translate(150, 145)">
      <path d="M 0 16 C 0 7 7 0 16 0 L 92 0 L 132 40 L 132 150 C 132 159 125 166 116 166 L 16 166 C 7 166 0 159 0 150 Z"
            fill="url(#softFill)" stroke="url(#accentGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 92 0 L 92 40 L 132 40" fill="none" stroke="url(#accentGrad)" stroke-width="11" stroke-linejoin="round" />
      <line x1="28" y1="70" x2="76" y2="70" stroke="url(#accentGrad)" stroke-width="9" stroke-linecap="round" />
      <line x1="28" y1="102" x2="104" y2="102" stroke="url(#accentGrad)" stroke-width="9" stroke-linecap="round" />
    </g>

    <!-- Front Folder Body -->
    <path d="M 74 245 C 64 245 56 254 57 264 L 75 425 C 77 439 89 450 103 450 L 409 450 C 423 450 435 439 437 425 L 455 264 C 456 254 448 245 438 245 L 285 245 C 275 245 266 238 261 229 L 253 216 C 248 207 239 201 229 201 L 94 201 C 83 201 74 210 74 221 Z"
          fill="url(#softFill)" stroke="url(#mainGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Safety Shield -->
    <g transform="translate(256, 345)">
      <!-- Shield Outer Glow / Outline -->
      <path d="M 0 -44 C 28 -44 48 -32 48 -32 C 48 16 30 60 0 76 C -30 60 -48 16 -48 -32 C -48 -32 -28 -44 0 -44 Z"
            fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
      <!-- Inner Checkmark Symbol for safety -->
      <path d="M -15 2 L -4 14 L 18 -10"
            fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>