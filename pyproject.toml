[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "clutterxp"
dynamic = ["version"]
description = "Configurable, safe, lightweight file organizer: rules, preview, undo, watch, duplicates."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["file-organizer", "downloads", "automation", "cli", "linux"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "ruamel.yaml>=0.18",
  "ruamel.yaml.clib>=0.2.12; platform_python_implementation == 'CPython'",
  "watchdog>=4.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.0",
]

[project.scripts]
clutterxp = "clutterxp.cli.app:main"
cxp = "clutterxp.cli.app:main"

[project.gui-scripts]
clutterxp-gui = "clutterxp.gui.app:main"

[tool.hatch.version]
path = "src/clutterxp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clutterxp"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.yaml" = "clutterxp/config.example.yaml"
"packaging/clutterxp.service" = "clutterxp/packaging/clutterxp.service"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
timeout = 60
markers = [
  "slow: real watchdog / timing based tests",
  "perf: performance budget tests",
  "crash: fault-injection tests",
  "crossfs: needs a second filesystem (e.g. /dev/shm) or simulates EXDEV",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "S", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
# Frozen contracts: cannot be edited without CONTRACT_CHANGE; style issues are known and accepted
"src/clutterxp/models.py" = ["UP035", "UP037", "E501", "S105"]
"src/clutterxp/interfaces.py" = ["UP035", "UP037", "E501", "RUF022"]
"src/clutterxp/config/schema.py" = ["UP037", "E501", "SIM102"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/clutterxp"]
exclude = ["src/clutterxp/gui/"]
plugins = ["pydantic.mypy"]
